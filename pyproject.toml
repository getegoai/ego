[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ego-data-core"
version = "0.1.0"
description = "Local-first evidence vault and personal data core for Ego."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ego" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0"
]

[project.scripts]
ego-data-core = "ego_data_core.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

